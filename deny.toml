# cargo-deny configuration. The licence allow-list is the mechanism that keeps
# the AGPL tier out of the permissive crates. Do not add AGPL here; those
# backends belong in `sqzer-codecs-agpl`, which carries its own exception
# below and must never become a dependency of any other crate here.

[graph]
all-features = true

[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "MPL-2.0",           # file-level copyleft only (avif-parse)
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "CC0-1.0",
]
confidence-threshold = 0.9

# sqzer-codecs-agpl is deliberately AGPL-3.0 and deliberately never a
# dependency of any other crate in this workspace. It gets its own
# allowance instead of widening the allow-list above.
exceptions = [
    { allow = ["AGPL-3.0-only"], name = "sqzer-codecs-agpl" },
    # `rav1e` lists `libfuzzer-sys` under `cfg(fuzzing)`, which no build
    # of this workspace sets, so it is never compiled or linked. NCSA is a
    # permissive BSD-style licence; it is allowed for this one crate rather
    # than globally because nothing that ships needs it.
    { allow = ["NCSA"], name = "libfuzzer-sys" },
]

[bans]
multiple-versions = "warn"
wildcards = "deny"
deny = [
    # AGPL / commercial dual-licensed pure-Rust codecs. Good crates, wrong tier.
    { crate = "zenwebp" },
    { crate = "zenjpeg" },
    { crate = "zenavif" },
    { crate = "zenravif" },
    { crate = "zenjxl" },
    { crate = "jxl-encoder" },
    { crate = "rav1d-safe" },
    { crate = "heic" },
]

[advisories]
yanked = "deny"
ignore = [
    # `paste` is archived, not vulnerable: a proc macro that only runs at
    # build time. It reaches us through `re_rav1d` and `rav1e`. Drop this
    # entry when both have moved to a release without it.
    { id = "RUSTSEC-2024-0436", reason = "unmaintained proc macro, build-time only, via re_rav1d and rav1e" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
