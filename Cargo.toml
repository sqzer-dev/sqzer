[workspace]
resolver = "3"
members = ["crates/*"]
# The calibration harness is its own package: `codec-eval` pulls in an AGPL
# dependency that must never enter this workspace's dependency graph. See
# `tools/calibrate/Cargo.toml`.
exclude = ["tools/calibrate"]

[workspace.package]
version = "0.0.1"
edition = "2024"
# 1.92 is what `gamut-jxl` (the `native-jxl` backend) asks for; the
# portable tier itself needs nothing newer than 1.89.
rust-version = "1.92"
license = "MIT OR Apache-2.0"
authors = ["Vladyslav Vladinov"]
repository = "https://github.com/vlad-salone/sqzer"
homepage = "https://sqzer.dev"
readme = "README.md"
keywords = ["image", "optimization", "avif", "jpegxl", "webp"]
categories = ["multimedia::images", "command-line-utilities"]

[workspace.dependencies]
sqzer-core = { path = "crates/sqzer-core", version = "0.0.1" }
sqzer-codecs = { path = "crates/sqzer-codecs", version = "0.0.1", default-features = false }
sqzer-metrics = { path = "crates/sqzer-metrics", version = "0.0.1" }
sqzer = { path = "crates/sqzer", version = "0.0.1", default-features = false }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"

[profile.release]
lto = "fat"
codegen-units = 1
strip = true
