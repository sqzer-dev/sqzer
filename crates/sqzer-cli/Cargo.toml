[package]
name = "sqzer-cli"
description = "Command-line interface for sqzer."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[[bin]]
name = "sqzer"
path = "src/main.rs"
doc = false

[features]
default = ["portable"]
portable = ["sqzer/portable"]
native = ["sqzer/native"]

[dependencies]
sqzer.workspace = true
# Argument parsing. MIT OR Apache-2.0.
clap = { version = "4.5", features = ["derive", "wrap_help"] }
# Terminal styles, and a stderr that strips them when stderr is not a
# terminal or `NO_COLOR` is set, and enables VT mode on Windows. Both
# already in the tree through `clap`. MIT OR Apache-2.0.
anstream = "1.0"
anstyle = "1.0"
# `--json` output. MIT OR Apache-2.0.
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
# Per-file parallelism (ADR-0001 D3). MIT OR Apache-2.0.
rayon = "1.10"
# In-process glob expansion for shells that do not expand, and the
# `--include` / `--exclude` filters. MIT OR Apache-2.0.
glob = "0.3"

[lints]
workspace = true
