[package]
name = "sqzer-codecs"
description = "Codec backends for sqzer, every one behind a feature flag."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[features]
default = ["portable"]

# Tier 1: pure Rust, permissive. Must build on wasm32.
portable = [
    "png",
    "jpeg",
    "webp-lossless",
    "avif",
    "jxl-decode",
    "heif",
    "gif",
    "tiff",
    "bmp",
    "tga",
    "ico",
    "qoi",
    "pnm",
    "svg",
]
# `oxipng` is the PNG writer on desktop targets; on wasm32 it is compiled
# out (see below) and the plain `png` writer takes its place.
png = ["dep:png", "dep:oxipng"]
jpeg = ["dep:mozjpeg-rs", "dep:zune-jpeg", "dep:kamadak-exif"]
webp-lossless = ["dep:image-webp", "dep:kamadak-exif"]
# The AVIF encoder builds everywhere. The decoder is desktop only: `rav1d`
# does not compile for wasm32, so on that target this feature adds the
# encoder and nothing else.
avif = ["dep:avif-parse", "dep:re_rav1d", "dep:yuv", "dep:ravif", "dep:rgb"]
jxl-decode = ["dep:jxl-oxide"]
# HEIC recognised and its header read (size, rotation, ICC) with no
# decoder: a portable build says "needs `native-heif`" for a HEIC instead
# of "unrecognised". Pure Rust, no dependencies.
heif = []
# Input-only formats. GIF and TIFF have their own crates; BMP, TGA, ICO,
# QOI and PNM are the simple containers `image` reads, one feature per
# format so `decoder_features` can name it. SVG is rasterised by `resvg`.
gif = ["dep:gif"]
tiff = ["dep:tiff"]
bmp = ["dep:image", "image/bmp"]
tga = ["dep:image", "image/tga"]
ico = ["dep:image", "image/ico"]
qoi = ["dep:image", "image/qoi"]
pnm = ["dep:image", "image/pnm"]
svg = ["dep:resvg"]

# Tier 2: C bindings. Opt-in, desktop targets only; a native feature on
# wasm32 is a compile error. Each feature vendors its C library and builds
# it with `cc` or `cmake`, except `native-heif`, which links nothing: it
# uses the OS decoder where there is one and loads `libheif` at runtime
# (ADR-0005). A native backend registers after the portable one for the
# same format and takes it over. See ADR-0004 for the crate choices.
native = ["native-webp", "native-jxl", "native-avif", "native-heif", "native-jpegli"]
# Lossy and lossless WebP over `libwebp`.
native-webp = ["dep:webpx"]
# JPEG XL encoding over `libjxl`. Needs cmake and a C++ compiler.
native-jxl = ["dep:gamut-jxl", "dep:gamut-core"]
# AVIF encoding over `libavif` + `libaom`. Needs cmake, and `nasm` on x86.
native-avif = ["dep:libavif"]
# HEIC decoding: ImageIO on macOS, WIC on Windows, and `libheif` loaded at
# runtime everywhere but musl. Nothing to install at build time; at run
# time a machine needs one of those, and `--list-codecs` says which it
# has. Which crates apply is decided per target below.
native-heif = ["heif", "dep:heif-dl", "dep:heif-imageio", "dep:heif-wic"]
# JPEG encoding over `jpegli`. Needs cmake and a C++ compiler.
native-jpegli = ["dep:jpegli"]

[dependencies]
sqzer-core.workspace = true
png = { version = "0.18.1", optional = true }
# Default features pull in `imgref` and the zenyuv fast colour path; neither
# is needed for the byte-slice API, and fewer crates is fewer licences.
mozjpeg-rs = { version = "0.9.2", optional = true, default-features = false }
# `x86` / `neon` default features are runtime-detected SIMD paths and only
# matter for speed. `std` is needed for the reader.
zune-jpeg = { version = "0.5.15", optional = true, default-features = false, features = ["std"] }
image-webp = { version = "0.2.4", optional = true }
# AVIF encoder over rav1e. BSD-3-Clause. `asm` is off so no nasm is needed
# and the build stays pure Rust; `threading` is off because encoders are
# single-threaded until the thread budget lands (ADR-0001 D3).
ravif = { version = "0.13.0", optional = true, default-features = false }
# Pixel slice casts for `ravif`'s API. MIT. Already in the tree via `ravif`.
rgb = { version = "0.8.53", optional = true, default-features = false }
# Decoding stays single-threaded (ADR-0001 D3), so the rayon pool is off.
jxl-oxide = { version = "0.12.6", optional = true, default-features = false }
# Only the orientation tag is read. BSD-2-Clause.
kamadak-exif = { version = "0.6.1", optional = true }
# GIF reader, first frame. MIT OR Apache-2.0. `color_quant` is for the
# encoder and is off.
gif = { version = "0.14.2", optional = true, default-features = false, features = ["std"] }
# TIFF reader. MIT. LZW, Deflate and JPEG-in-TIFF strips; the fax
# (CCITT) codec would add a crate and is off.
tiff = { version = "0.11.3", optional = true, default-features = false, features = ["lzw", "deflate", "jpeg"] }
# The simple raster containers: BMP, TGA, ICO, QOI, PNM. Decoders only;
# `image`'s encoders are what this project replaces (ADR-0001) and no
# feature enables one. MIT OR Apache-2.0. The `ico` feature pulls
# `image`'s PNG reader, over the `png` crate already in the tree.
image = { version = "0.25.10", optional = true, default-features = false }
# SVG rasteriser. Apache-2.0 OR MIT. `text` shapes text, `raster-images`
# renders embedded PNG, JPEG, GIF and WebP through crates already in the
# tree. System fonts are loaded on desktop targets only, see below.
resvg = { version = "0.48.1", optional = true, default-features = false, features = ["text", "raster-images"] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
# `<text>` in an SVG needs fonts; on desktop targets `resvg` reads the
# system's, memory-mapped. wasm32 has no file system and renders text
# with whatever is embedded, which is nothing.
resvg = { version = "0.48.1", optional = true, default-features = false, features = ["system-fonts", "memmap-fonts"] }
# PNG optimiser. MIT. Its DEFLATE step is `libdeflate`, a vendored C
# library built by `cc`, which is why it is desktop only: see ADR-0002.
# `parallel` is off (single-threaded encoders, ADR-0001 D3), `zopfli`
# (Apache-2.0, pure Rust) backs the top effort level.
oxipng = { version = "10.2.1", optional = true, default-features = false, features = ["zopfli"] }
# ISOBMFF demuxer. MPL-2.0, file-level copyleft, on the allow-list.
avif-parse = { version = "2.1.0", optional = true }
# rerun's fork of rav1d (BSD-2-Clause) with a safe Rust API; upstream rav1d
# 1.1 exposes only the C ABI, which this workspace's `forbid(unsafe_code)`
# cannot call. Assembly is off so no nasm is needed to build; the Rust
# fallback paths are used everywhere.
re_rav1d = { version = "0.1.3", optional = true, default-features = false, features = ["bitdepth_8", "bitdepth_16"] }
# YUV to RGB, 8 to 16 bit. BSD-3-Clause OR Apache-2.0.
yuv = { version = "0.8.17", optional = true }

# ---- native tier ----
# `libwebp` through imazen's safe wrapper. MIT OR Apache-2.0; `libwebp-sys`
# (MIT) vendors libwebp and builds it with `cc`, bindings pregenerated.
# Only the encoder and the ICC mux are compiled; decoding stays with
# `image-webp`.
webpx = { version = "0.4.0", optional = true, default-features = false, features = ["encode", "icc", "std"] }
# `libjxl` 0.12 through `gamut-jxl` (MIT OR Apache-2.0), whose FFI
# declarations are written by hand so no `bindgen` runs at build time.
# `jpegxl-src` (BSD-3-Clause) vendors libjxl with highway, brotli and skcms
# and builds it with cmake. Not `jpegxl-rs`: that crate is GPL-3.0. The
# `decode` feature would pull in `jxl-rs`; decoding stays with `jxl-oxide`.
gamut-jxl = { version = "0.4.0", optional = true, default-features = false, features = ["encode"] }
# The image types `gamut-jxl` encodes from. MIT OR Apache-2.0.
gamut-core = { version = "2.0.1", optional = true }
# `libavif` 1.0 with `libaom` as its only codec. All three crates are
# BSD-2-Clause; libaom itself is BSD-2-Clause plus the AOMedia patent
# licence. cmake builds both libraries; x86 needs `nasm`. The default
# `codec-dav1d` and `codec-rav1e` features are off: decoding stays with
# `re_rav1d` and rav1e is the portable tier's encoder already.
libavif = { version = "0.14.0", optional = true, default-features = false, features = ["codec-aom"] }
# `jpegli` through Kornel's mozjpeg-style wrapper. BSD-3-Clause;
# `jpegli-sys` (BSD-3-Clause) vendors libjxl 0.10's jpegli and highway and
# builds them with cmake.
jpegli = { version = "0.1.0", optional = true }

# ---- native-heif, per target (ADR-0005). The crates are in this
# workspace and hold the `unsafe` this crate forbids. `libheif` and its
# HEVC decoder are LGPL-3.0 and loaded from the system at run time, never
# vendored or linked; a static musl binary cannot load them at all.
[target.'cfg(not(any(target_arch = "wasm32", target_env = "musl")))'.dependencies]
heif-dl = { workspace = true, optional = true }

[target.'cfg(target_os = "macos")'.dependencies]
heif-imageio = { workspace = true, optional = true }

[target.'cfg(windows)'.dependencies]
heif-wic = { workspace = true, optional = true }

[lints]
workspace = true
