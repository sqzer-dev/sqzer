[package]
name = "heif-dl"
description = "libheif loaded at runtime through libloading, for sqzer's `native-heif` feature. Not a public API."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[dependencies]
# `dlopen` / `LoadLibrary` behind a safe handle type. ISC.
libloading = "0.9.0"

# This crate exists to hold the `unsafe` the workspace forbids: every call
# into libheif goes through a function pointer read out of a library
# loaded at runtime. Keep it small and review it as a binding.
[lints.rust]
unsafe_op_in_unsafe_fn = "deny"
missing_docs = "warn"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
undocumented_unsafe_blocks = "warn"
