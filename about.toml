# `cargo about` writes the licence notices of everything compiled into a
# build, `THIRD-PARTY-LICENSES.txt`: `tools/notices.sh` runs it with
# `about.hbs` next to this file, for the npm package and for each
# release archive. The accepted list is the allow-list of `deny.toml`, in
# the order a crate that offers a choice is taken: a crate that is
# `MIT OR Apache-2.0` ships its MIT notice. The last two are not crate
# licences, `deny.toml` never sees them: they are the terms of C code
# inside a vendored tree, named by the clarifications below.
accepted = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "MPL-2.0",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "CC0-1.0",
    "IJG",
    "BSD-3-Clause-Clear",
]
# The target comes from `tools/notices.sh`, so what only another target
# compiles is not in the file. Dev dependencies do not ship. Build
# dependencies are kept, for one of them: `jpegxl-src`, a build
# dependency of `gamut-jxl-sys`, is where the libjxl source compiled into
# the binary lives. `sqzer-wasm` itself, `publish = false`, is out, and
# the four published workspace crates are left out by the template, on
# their repository: sqzer's own licence is next to the file.
ignore-build-dependencies = false
ignore-dev-dependencies = true
private = { ignore = true }
# A notice lives at the root of a crate. Scanned deeper, the tree gave a
# C fuzzing harness in `qoi` and Rust source headers in `kamadak-exif`
# as licence texts, each with a notice inside it.
max-depth = 1

# What the scan cannot read on its own, clarified per crate. Every
# checksum pins a file's text, not a crate version: a bump keeps working
# until the notice itself changes, and then `pack.sh` fails until the
# entry is checked again. `files` are read from the crate as published,
# `git` from its repository at the commit it was published from, for a
# crate that ships no notice and keeps one at the root of its repository.
# Three crates stay on the bare licence text: `simd_helpers` has no
# notice in its repository either, `zune-inflate` names no repository,
# and the MIT bindings of `libwebp-sys` have none anywhere.

# Vendors and compiles `libdeflate`, a C library under its own MIT
# notice, which the crate's Apache-2.0 field does not carry.
[libdeflate-sys]
clarify = { license = "Apache-2.0 AND MIT", files = [
    { path = "LICENSE", license = "Apache-2.0", checksum = "a60eea817514531668d7e00765731449fe14d059d3249e0bc93b36de45f759f2" },
    { path = "libdeflate/COPYING", license = "MIT", checksum = "4ad69099cb4374836fd27583d9991e2838cd86b6e4666ab26b2d32582c91e73a" },
] }

