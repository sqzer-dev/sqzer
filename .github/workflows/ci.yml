name: ci

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  check:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest,  target: x86_64-unknown-linux-gnu }
          - { os: ubuntu-latest,  target: x86_64-unknown-linux-musl }
          - { os: ubuntu-24.04-arm, target: aarch64-unknown-linux-gnu }
          - { os: macos-latest,   target: aarch64-apple-darwin }
          - { os: macos-15-intel,       target: x86_64-apple-darwin }
          - { os: windows-latest, target: x86_64-pc-windows-msvc }
    env:
      # `oxipng` builds `libdeflate` (C) with `cc`, which on the musl
      # target wants a musl-targeting compiler. `musl-tools` provides
      # `musl-gcc`; the variable is ignored on every other target.
      CC_x86_64_unknown_linux_musl: musl-gcc
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - if: matrix.target == 'x86_64-unknown-linux-musl'
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --workspace --target ${{ matrix.target }}
      - run: cargo test --workspace --target ${{ matrix.target }}

  # The native tier builds its C libraries from source (libwebp, libaom,
  # libavif, libjxl twice). HEIC links nothing: it uses the OS decoder on
  # macOS and Windows and loads libheif at run time (ADR-0005), so the
  # Linux and macOS jobs install libheif for the loader's tests and the
  # Windows job proves whichever path the runner has, decode or a clean
  # "unavailable". ADR-0004 lists what each target can and cannot build;
  # the feature set per target below is that list. Partial sets test the
  # library crates only: the CLI tests assume the whole tier or none of
  # it.
  native:
    name: native ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest,    target: x86_64-unknown-linux-gnu,  features: native }
          # `jpegli-sys`'s vendored libjxl 0.10 segfaults on the first
          # encode on this runner (GCC, Neoverse); the same code passes on
          # Apple Silicon. Out until the binding moves to a newer tree.
          - { os: ubuntu-24.04-arm, target: aarch64-unknown-linux-gnu, features: "native-webp,native-jxl,native-avif,native-heif" }
          # musl-tools has no C++ compiler, so the libjxl and jpegli
          # backends stay out until a musl cross toolchain is wired in.
          # `native-heif` builds on musl but registers nothing: a static
          # binary cannot load libheif at run time (ADR-0005 D8).
          - { os: ubuntu-latest,    target: x86_64-unknown-linux-musl, features: "native-webp,native-avif,native-heif" }
          - { os: macos-latest,     target: aarch64-apple-darwin,      features: native }
          - { os: macos-15-intel,   target: x86_64-apple-darwin,       features: native }
          # HEIC on Windows is WIC, so `native-heif` builds without vcpkg.
          # jpegli is still out: `jpegli-sys` expects a single-config
          # cmake generator (Ninja) while `jpegxl-src` asks for the
          # ClangCL toolset that only the Visual Studio generator has.
          - { os: windows-latest,   target: x86_64-pc-windows-msvc,    features: "native-webp,native-jxl,native-avif,native-heif" }
    env:
      CC_x86_64_unknown_linux_musl: musl-gcc
      # libaom is C, but its cmake project also asks for a C++ compiler
      # and musl-tools ships none. The host g++ only has to pass cmake's
      # compiler check; no C++ source is compiled into the library.
      CXX_x86_64_unknown_linux_musl: g++
      # The vendored libjpeg-turbo inside jpegli's libjxl tree declares a
      # cmake floor that cmake 4 refuses; this lifts it.
      CMAKE_POLICY_VERSION_MINIMUM: "3.5"
      RUST_BACKTRACE: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - if: matrix.target == 'x86_64-unknown-linux-musl'
        run: sudo apt-get update && sudo apt-get install -y musl-tools nasm
      # Nothing links libheif; the runtime loader's tests need the
      # library and its HEVC decoder present, which Ubuntu ships as two
      # packages. The loader reports "no HEVC decoder plugin" without
      # the second one.
      - if: matrix.target == 'x86_64-unknown-linux-gnu' || matrix.target == 'aarch64-unknown-linux-gnu'
        run: sudo apt-get update && sudo apt-get install -y nasm libheif1 libheif-plugin-libde265
      # ImageIO is the first HEIC decoder on macOS; brew's libheif is
      # there so the loader is tested on this platform too.
      - if: runner.os == 'macOS'
        run: brew install libheif
      # ADR-0005 item 4: what the Windows runner can decode. The listing
      # below shows which path the WIC tests took.
      - if: runner.os == 'Windows'
        shell: pwsh
        run: |
          'Microsoft.HEIFImageExtension', 'Microsoft.HEVCVideoExtension*' | ForEach-Object { Get-AppxPackage -AllUsers -Name $_ } | Format-List Name, Version, Status
          Write-Host "(an empty listing means neither Store package is installed)"
      # libaom 3.11's configure greps `nasm -hf` for `-Ox`, which nasm 3
      # (what brew installs) no longer prints, so the Intel Mac gets the
      # last nasm 2 from nasm.us instead.
      - if: matrix.target == 'x86_64-apple-darwin'
        run: |
          curl -sSL -o nasm.zip https://www.nasm.us/pub/nasm/releasebuilds/2.16.03/macosx/nasm-2.16.03-macosx.zip
          unzip -q nasm.zip -d "$HOME/nasm"
          echo "$HOME/nasm/nasm-2.16.03" >> "$GITHUB_PATH"
      - if: runner.os == 'Windows'
        uses: ilammy/setup-nasm@v1
      - uses: Swatinem/rust-cache@v2
        with:
          key: native
      # `sqzer-cli` names the same features as `sqzer-codecs`, so the
      # list applies to the binary as is; testing one package at a time
      # needs the `package/feature` spelling and keeps a crash in one
      # backend from hiding the other results.
      - shell: bash
        run: |
          list=$(echo "${{ matrix.features }}" | tr ',' '\n')
          echo "CODECS_FEATURES=$(echo "$list" | sed 's#^#sqzer-codecs/#' | paste -sd ',' -)" >> "$GITHUB_ENV"
          echo "SQZER_FEATURES=$(echo "$list" | sed 's#^#sqzer/#' | paste -sd ',' -)" >> "$GITHUB_ENV"
      - run: cargo build -p sqzer-cli --target ${{ matrix.target }} --features ${{ matrix.features }}
      # What this build has and whether this runner can use it; the HEIC
      # line says which decoder answered the probe.
      - run: cargo run -p sqzer-cli --target ${{ matrix.target }} --features ${{ matrix.features }} -- --list-codecs
      - run: cargo test -p sqzer-codecs --target ${{ matrix.target }} --features ${{ env.CODECS_FEATURES }}
      - run: cargo test -p sqzer --target ${{ matrix.target }} --features ${{ env.SQZER_FEATURES }}
      # The CLI tests expect the whole tier or none of it.
      - if: matrix.features == 'native'
        run: cargo test -p sqzer-cli --target ${{ matrix.target }} --features native

  wasm:
    name: wasm32 portable tier
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      # --no-default-features on the codec crate proves a C dependency
      # cannot sneak into the portable tier.
      - run: cargo build -p sqzer-wasm --target wasm32-unknown-unknown

  lint:
    runs-on: ubuntu-latest
    env:
      CMAKE_POLICY_VERSION_MINIMUM: "3.5"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      # `--all-features` builds the native tier's C libraries too.
      - run: sudo apt-get update && sudo apt-get install -y nasm
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --all-features
      - run: cargo doc --workspace --no-deps
        env:
          RUSTDOCFLAGS: -D warnings

  deny:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
