# Issues are in English (CONTRIBUTING.md). An issue whose prose is mostly
# in a non-Latin script gets a comment, the `needs-english` label and is
# closed as not planned; once it is edited into English it is reopened.
# Latin-script languages other than English are not detected: the
# checkbox in the issue forms covers those.
name: issue language

on:
  issues:
    types: [opened, edited]

permissions:
  issues: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v8
        with:
          script: |
            const LABEL = 'needs-english';
            const issue = context.payload.issue;
            const ref = { owner: context.repo.owner, repo: context.repo.repo, issue_number: issue.number };

            const mostlyForeign = (text) => {
              const letters = text.match(/\p{L}/gu) ?? [];
              const foreign = letters.filter((c) => !/\p{Script=Latin}/u.test(c)).length;
              return letters.length >= 2 && foreign / letters.length >= 0.3;
            };
            // Only the prose counts: code, links, the form's own headings,
            // its checkbox lines and empty answers are dropped. The title
            // is judged on its own, since the form's dropdown and OS
            // answers are Latin text that would outweigh a short body.
            const prose = (issue.body ?? '')
              .replace(/```[\s\S]*?```/g, '')
              .replace(/`[^`\n]*`/g, '')
              .replace(/https?:\/\/\S+/g, '')
              .replace(/^###? .*$/gm, '')
              .replace(/^- \[[ xX]\] .*$/gm, '')
              .replace(/_No response_/g, '');
            const english = !mostlyForeign(issue.title.replace(/`[^`]*`/g, '')) && !mostlyForeign(prose);
            const labelled = issue.labels.some((l) => l.name === LABEL);

            if (!english && !labelled && issue.state === 'open') {
              await github.rest.issues.createComment({
                ...ref,
                body: [
                  'Issues here are in English, so this one is closed for now. Please edit it into English, machine translation is fine, and it reopens automatically. See CONTRIBUTING.md.',
                  '',
                  '请用英文编辑此 issue（机器翻译也可以），编辑后会自动重新打开。',
                ].join('\n'),
              });
              await github.rest.issues.addLabels({ ...ref, labels: [LABEL] });
              await github.rest.issues.update({ ...ref, state: 'closed', state_reason: 'not_planned' });
            } else if (english && labelled) {
              await github.rest.issues.removeLabel({ ...ref, name: LABEL });
              if (issue.state === 'closed') {
                await github.rest.issues.update({ ...ref, state: 'open' });
              }
            }
